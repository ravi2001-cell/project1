<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Project1 - Users</title>
</head>
<body>
<h1>Users</h1>
<table border="1">
    <tr><th>ID</th><th>Name</th><th>Email</th></tr>
    <tr th:each="u : ${users}">
        <td th:text="${u.id}">1</td>
        <td th:text="${u.name}">Name</td>
        <td th:text="${u.email}">email</td>
    </tr>
</table>
</body>
</html>
